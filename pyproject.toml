[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "voxcut"
version = "0.1.0"
description = "Cut the user's speech from long microphone recordings with measured recall (Silero VAD)"
requires-python = ">=3.12"
# torch: `make setup` installs the CPU build via --index-url before the package (C6).
dependencies = [
    "torch==2.14.1",
    "silero-vad==6.2.3",
    "numpy",
    "soundfile",
]

[project.scripts]
voxcut = "voxcut.cli:main"

[project.optional-dependencies]
dev = ["pytest", "ruff"]

[tool.setuptools]
packages = ["voxcut", "voxcut.ui"]

[tool.setuptools.package-data]
"voxcut.ui" = ["static/*", "static/vendor/*", "static/img/*", "static/i18n/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]  # tools/ (leak check) is not part of the package
markers = [
    "slow: needs ffmpeg/torch; not part of make check",
    "host: runs real systemd --user units; not in CI (D63)",
]

[tool.ruff]
line-length = 100
target-version = "py312"
